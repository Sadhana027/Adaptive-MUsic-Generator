<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login / Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            margin: 0;
            min-height: 100vh;
        }

```
    .container {
        background: rgba(0, 0, 0, 0.5);
        padding: 30px;
        border-radius: 10px;
        width: 320px;
        box-sizing: border-box;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: none;
        border-radius: 5px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #00ffcc;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        color: #004d40;
    }

    button:hover {
        background: #00ccaa;
    }

    hr {
        border: 1px solid #00ffcc;
        margin: 20px 0;
    }

    .message {
        color: yellow;
        margin-top: 10px;
        text-align: center;
        font-weight: bold;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h2>Login</h2>

    <form action="{{ url_for('login') }}" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
            autocomplete="email"
        />

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
        />

        <button type="submit">Login</button>

    </form>

    <hr>

    <h2>Signup</h2>

    <form action="{{ url_for('register') }}" method="POST">

        <input
            type="text"
            name="full_name"
            placeholder="Full Name"
            required
            autocomplete="name"
        />

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
            autocomplete="email"
        />

        <input
            type="password"
            name="password"
            placeholder="New Password"
            required
            autocomplete="new-password"
        />

        <button type="submit">Signup</button>

    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="message">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

</div>
```

</body>
</html>
